# Configuration du Tracker Eirbone

# Port TCP d'écoute du tracker
port = 9041

# Nombre maximum de clients connectés simultanément
max_clients = 10

# Niveau de verbosité du log : 0 = erreurs seules, 1 = info, 2 = debug
verbosity = 1

# Délai (secondes) avant qu'un pair sans update soit retiré de l'index
peer_timeout = 90
